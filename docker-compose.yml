# Default: Sage in Docker, using the MySQL server on this Mac (the one MySQL Workbench uses).
# Bundled MySQL instead: docker compose -f docker-compose.yml -f docker-compose.mysql.yml up -d --build
services:
  sage:
    build: .
    image: sage-ai:latest
    restart: unless-stopped
    env_file: .env.docker
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - sage-instance:/app/instance
      - ./logs:/app/logs

volumes:
  sage-instance:
